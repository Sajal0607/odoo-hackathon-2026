{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your Dayflow account</p>
<form method="POST">
<div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
        </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
    </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

       <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>

  <div class="demo-hint">
            <strong>Demo admin:</strong> admin@dayflow.com / admin123
        </div>
      </div>
    </div>
    {% endblock %}
